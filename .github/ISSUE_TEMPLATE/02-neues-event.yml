name: Neues Event
description: Genau einen Event-Eintrag für mysteryland.biz anlegen oder vervollständigen
type: Event
labels:
  - "area: content"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        ## Ein Issue entspricht genau einem Event

        - **Titel** – Hauptact oder Eventname. Bei Festivals und Shows den Namen der Veranstaltung verwenden.
        - **Fields** – Veranstaltungsdatum in `Start date`, Stadt in `City` und Spielstätte in `Venue` eintragen. Belegte `Veranstalter` und den `Preis` in EUR ergänzen, sobald sie bekannt sind. Bei belegtem Gratis-Eintritt `0` eintragen.
        - **Labels** – Für die belegten Haupt-, Vor- und Gastacts sowie die dokumentierten Acts bei Festivals und Pop-Shows die blauen Künstlerlabels (`#0052cc`) anhand der Namen auswählen. Fehlende Künstlerlabels unter „Line-up – Ergänzungen“ vermerken.

  - type: dropdown
    id: category
    attributes:
      label: Kategorie
      options:
        - Konzert
        - Festival
        - Lesung
        - Musical
        - TBA
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: Land
      placeholder: Deutschland

  - type: textarea
    id: artists
    attributes:
      label: Line-up – Ergänzungen
      description: Rollen und fehlende Künstlerlabels vermerken, soweit für die Eventseite relevant.
      placeholder: |
        Hauptact: Die Toten Hosen
        Voract: Beatsteaks
        Gastact: die ärzte

  - type: input
    id: tour
    attributes:
      label: Tour oder Motto
      placeholder: Tourname oder Motto, falls bekannt

  - type: textarea
    id: running_order
    attributes:
      label: Running Order
      description: Bei Festivals eine Zeile je Auftritt im Format `HH:MM-HH:MM | Künstler`; leer lassen, wenn noch unbekannt.
      placeholder: |
        13:45-14:20 | The Gems
        14:40-15:20 | Phil Campbell’s Bastard Sons

  - type: dropdown
    id: event_status
    attributes:
      label: Eventstatus
      options:
        - scheduled
        - completed
        - postponed
        - cancelled

  - type: dropdown
    id: phase
    attributes:
      label: Bearbeitungsphase
      description: Steuert die erste Einordnung für Board und spätere Automationen.
      options:
        - Event vorbereiten
        - Event nachbereiten
        - Bestehenden Eintrag pflegen
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Quellen und Medien
      description: Verlässliche URLs sowie vorhandene Tickets, Fotos, Setlists oder Alben.
      placeholder: Link oder Dateipfad im Repo für Ticket, Scan oder Plakat.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Hinweise
      description: Besonderheiten, gewünschte Ergänzungen oder klare Abgrenzungen.

  - type: checkboxes
    id: deliverables
    attributes:
      label: Gewünschte Ergebnisse
      description: Die Auswahl bildet den Arbeitsumfang ab und kann später von Actions ausgewertet werden.
      options:
        - label: Event-MDX aus den strukturierten Issue-Daten erzeugen
        - label: Eventdaten und Status aktualisieren
        - label: Fotos importieren und Galerie synchronisieren
        - label: Bericht verfassen oder vervollständigen
        - label: Setlists und Videos ergänzen
        - label: SEO und Open-Graph-Bild prüfen
        - label: Social-Paket erzeugen
